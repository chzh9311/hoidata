<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOI Web Viewer — {{ dataset_name }} / {{ split }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="importmap">
  {
    "imports": {
      "three": "{{ url_for('static', filename='vendor/three.module.js') }}",
      "three/addons/controls/OrbitControls.js": "{{ url_for('static', filename='vendor/OrbitControls.js') }}"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <button id="prevBtn" class="nav" title="Previous sequence">&lt;</button>
      <select id="seqSelect">
        {% for s in sequences %}
        <option value="{{ s.index }}">#{{ s.index }} — {{ s.obj_name }} / {{ s.action_name }} ({{ s.nframes }}f)</option>
        {% endfor %}
      </select>
      <button id="nextBtn" class="nav" title="Next sequence">&gt;</button>
      <span class="label" id="seqLabel"></span>
    </div>

    <div id="viewport">
      <div id="status">initializing…</div>
    </div>

    <div id="controls">
      <button id="playBtn">Pause</button>
      <!-- Custom segmented scrub bar: colored blocks per labelled interval with
           the action text, an unlabelled base track, and a moving playhead.
           Click / drag anywhere on it to scrub. -->
      <div id="scrub" title="Click or drag to scrub">
        <div id="baseTrack"></div>
        <div id="segTrack"></div>
        <div id="playhead"></div>
      </div>
      <span id="frameReadout">0 / 0</span>
    </div>
    <div id="legend">
      <span><i class="sw" style="background:#3373f2"></i>left</span>
      <span><i class="sw" style="background:#e64040"></i>right</span>
      <span><i class="sw" style="background:#40bf59"></i>both</span>
      <span id="activeLabel"></span>
    </div>
  </div>

  <script>
    window.__FPS__ = {{ fps }};
  </script>
  <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
