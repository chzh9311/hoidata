<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOI Web Viewer — {{ dataset_name }} / {{ split }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script type="importmap">
  {
    "imports": {
      "three": "{{ url_for('static', filename='vendor/three.module.js') }}",
      "three/addons/controls/OrbitControls.js": "{{ url_for('static', filename='vendor/OrbitControls.js') }}"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <button id="prevBtn" class="nav" title="Previous sequence">&lt;</button>
      <select id="seqSelect">
        {% for s in sequences %}
        <option value="{{ s.index }}">#{{ s.index }} — {{ s.obj_name }} / {{ s.action_name }} ({{ s.nframes }}f)</option>
        {% endfor %}
      </select>
      <button id="nextBtn" class="nav" title="Next sequence">&gt;</button>
      <span class="label" id="seqLabel"></span>
    </div>

    <div id="viewport">
      <div id="status">initializing…</div>
    </div>

    <div id="controls">
      <button id="playBtn" title="Pause (space)">⏸</button>
      <!-- 3-track scrub bar: top = action labels (colored blocks + text);
           middle = left-hand stable grasps (blue); bottom = right-hand stable
           grasps (red). A single playhead spans all three. Click / drag
           anywhere to scrub. -->
      <div id="scrub" title="Click or drag to scrub">
        <div class="track" id="trackAction">
          <span class="trackName">action</span>
          <div class="lane"><div class="base"></div><div class="segs" id="segAction"></div></div>
        </div>
        <div class="track" id="trackLeft">
          <span class="trackName">L grasp</span>
          <div class="lane"><div class="base"></div><div class="segs" id="segLeft"></div></div>
        </div>
        <div class="track" id="trackRight">
          <span class="trackName">R grasp</span>
          <div class="lane"><div class="base"></div><div class="segs" id="segRight"></div></div>
        </div>
        <div class="track" id="trackSeg" hidden>
          <span class="trackName">action</span>
          <div class="lane"><div class="base"></div><div class="segs" id="segSeg"></div></div>
        </div>
        <div id="playhead"><div class="line"></div></div>
      </div>
      <span id="frameReadout">0 / 0</span>
    </div>
    <div id="legend">
      <span><i class="sw" style="background:#40bf59"></i>action</span>
      <span><i class="sw" style="background:#3373f2"></i>L grasp</span>
      <span><i class="sw" style="background:#e64040"></i>R grasp</span>
      <span id="segLegend" hidden>
        <i class="sw" style="background:#808080"></i>null
        <i class="sw" style="background:#f2b333"></i>transition
        <i class="sw" style="background:#40b366"></i>stable grasp
      </span>
      <span id="activeLabel"></span>
    </div>

    <!-- Action-label editor (shown only with --label). Click an action block to
         load it here, or ＋ New for a fresh interval. Set In/Out capture the
         playhead frame; Save writes the whole track to the working-copy file. -->
    <div id="editor" hidden>
      <div class="ed-row">
        <button id="edNew" title="Start a new interval">＋ New</button>
        <label>In <input id="edStart" type="number" min="0" step="1"></label>
        <button id="edSetIn" title="Set in-point to the playhead frame">Set In</button>
        <label>Out <input id="edEnd" type="number" min="1" step="1"></label>
        <button id="edSetOut" title="Set out-point to the playhead frame (exclusive)">Set Out</button>
      </div>
      <div class="ed-row">
        <input id="edAction" type="text" placeholder="action label (e.g. grasp)">
        <select id="edHand" title="Hand type">
          <option value="left">left</option>
          <option value="right">right</option>
          <option value="both" selected>both</option>
        </select>
        <button id="edApply" title="Add or update this interval (staged)">Add / Update</button>
        <button id="edDelete" title="Delete the selected interval (staged)">Delete</button>
        <button id="edSave" class="primary" title="Save all labels to the description file">Save to file</button>
        <span id="edStatus"></span>
      </div>
    </div>
  </div>

  <script>
    window.__FPS__ = {{ fps }};
    window.__LABEL_MODE__ = {{ 'true' if label_mode else 'false' }};
  </script>
  <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
